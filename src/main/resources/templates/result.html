
<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Výsledná cena</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header>
    <h1>HAIR STUDIO</h1>
</header>

<main>
    <div class="card">
        <h2>Výsledná cena stylingu</h2>

        <p>
            Vybraný styling:
            <strong th:text="${service}"></strong>
        </p>

        <h2>
            <span th:text="${price}"></span> Kč
        </h2>

        <p>
            Délka stylingu:
            <strong th:text="${duration}"></strong> minut
        </p>

        <p>Mytí vlasů: 15 minut</p>

        <a href="/">Zpět na výběr</a>
    </div>
</main>

</body>
</html>
